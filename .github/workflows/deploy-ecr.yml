name: Build and push image to ECR

on:
  # DEV: automatic build/push is OFF during code review. Re-enable it by
  # restoring the `push:` trigger below (and dropping `workflow_dispatch`)
  # once the code is approved.
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
  #   # Changes that never end up inside the image don't need a build.
  #   paths-ignore:
  #     - "terraform/**"
  #     - "sql/**"
  #     - "**.md"

# A newer commit on main supersedes any build still in progress.
concurrency:
  group: deploy-ecr
  cancel-in-progress: true

permissions:
  id-token: write # OIDC token to assume the AWS role
  contents: read

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: editorials-playlist-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Terraform output github_actions_role_arn, stored as a GitHub
          # repository variable (Settings > Secrets and variables > Actions).
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          REGISTRY: ${{ steps.ecr-login.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}"
          # linux/amd64 to match the ECS Fargate task, same as scripts/build_push_ecr.sh
          docker buildx build \
            --platform linux/amd64 \
            -t "${IMAGE}:latest" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            --push \
            .
          echo "Pushed ${IMAGE}:latest and ${IMAGE}:${GITHUB_SHA}"
